<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog — Phase Shift</title>
  <meta name="description" content="Notes and short posts." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* ── layout ─────────────────────────────────────── */
    .blog-wrap {
      max-width: 42rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    /* On wider screens, give the column a modest bump so multi-column
       tables breathe without pushing prose past a comfortable measure. */
    @media (min-width: 64rem) {
      .blog-wrap { max-width: 50rem; }
    }

    .blog-nav { margin-bottom: 2rem; font-size: 0.9rem; }
    .blog-nav a { color: inherit; margin-right: 1rem; }

    /* ── headings & prose ───────────────────────────── */
    .blog-post h1 {
      font-size: 1.85rem;
      line-height: 1.2;
      margin: 0 0 1.25rem;
    }
    .blog-post h2 {
      font-size: 1.35rem;
      line-height: 1.3;
      margin: 2.5rem 0 0.85rem;
      padding-top: 0.25rem;
    }
    .blog-post h3 {
      font-size: 1.1rem;
      line-height: 1.35;
      margin: 1.75rem 0 0.6rem;
    }
    .blog-post p { line-height: 1.65; margin: 0 0 1rem; }

    /* ── lists ──────────────────────────────────────── */
    .blog-post ul,
    .blog-post ol {
      margin: 0 0 1.25rem;
      padding-left: 1.5rem;
      line-height: 1.65;
    }
    .blog-post li { margin-bottom: 0.4rem; }
    .blog-post li > p { margin-bottom: 0.4rem; }

    /* ── blockquote ─────────────────────────────────── */
    .blog-post blockquote {
      margin: 1.5rem 0;
      padding: 0.25rem 0 0.25rem 1.1rem;
      border-left: 3px solid var(--accent, #5a7247);
      color: var(--muted, #6a5e4d);
    }
    .blog-post blockquote p { margin-bottom: 0.6rem; }
    .blog-post blockquote p:last-child { margin-bottom: 0; }

    /* ── horizontal rule ────────────────────────────── */
    .blog-post hr {
      border: 0;
      border-top: 1px solid var(--card-border, rgba(0,0,0,0.12));
      margin: 2.25rem 0;
    }

    /* ── inline code ────────────────────────────────── */
    .blog-post code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
      background: rgba(var(--text-rgb, 39, 26, 0), 0.06);
      padding: 0.1em 0.35em;
      border-radius: 3px;
    }

    /* ── images ─────────────────────────────────────── */
    .blog-post img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 1.5rem auto;
    }

    /* ── tables ─────────────────────────────────────── */
    /* Wrap the whole table block so it can scroll horizontally on narrow
       screens instead of overflowing the column. Markdown emits a bare
       <table>; this rule treats the table itself as the scroll container. */
    .blog-post table {
      display: block;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
      margin: 1.5rem 0 2rem;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .blog-post thead {
      border-bottom: 2px solid var(--accent, #5a7247);
    }
    .blog-post th,
    .blog-post td {
      padding: 0.65rem 0.85rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--card-border, rgba(0,0,0,0.1));
    }
    .blog-post th {
      font-weight: 600;
      color: var(--text, inherit);
    }
    .blog-post tbody tr:last-child td { border-bottom: 0; }
    .blog-post tbody tr:nth-child(even) td {
      background: rgba(var(--text-rgb, 39, 26, 0), 0.025);
    }

    /* ── links ──────────────────────────────────────── */
    .blog-post a {
      color: var(--accent, #5a7247);
      text-underline-offset: 2px;
    }
  </style>
    <!-- Google Consent Mode v2 + Osano CookieConsent (see js/consent-analytics.js) -->
  <script src="/js/site-config.js"></script>

  <style>
    /* Fixed bottom bar — opaque, never overlays top nav */
    .cc-window.cc-banner {
      background-color: #faf8f5 !important;
      color: #27201a !important;
      opacity: 1 !important;
      box-shadow: 0 -2px 20px rgba(39, 26, 0, 0.1);
      border-top: 1px solid rgba(90, 114, 71, 0.2);
    }
    .cc-window.cc-banner .cc-message { color: #27201a !important; }
    .cc-window, .cc-revoke { z-index: 10050 !important; }
    .cc-btn.cc-allow {
      background-color: #5a7247 !important;
      color: #ffffff !important;
      font-weight: 600 !important;
    }
    .cc-btn.cc-deny {
      background-color: #666666 !important;
      color: #ffffff !important;
      font-weight: 600 !important;
    }
    .cc-btn:hover { opacity: 0.9 !important; }
    .cc-btn:focus {
      outline: 2px solid #ffffff !important;
      outline-offset: 2px !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.js" data-cfasync="false"></script>

</head>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Text flowing around and along the Euler spiral — conformal typography meets pretext layout.">
  <title>Euler Spiral Text — Conformal Typography</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body {
      background: #0a1628;
      color: #c8e6ff;
      height: 100vh;
      overflow: hidden;
    }
    body {
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .line {
      position: absolute;
      white-space: pre;
      z-index: 1;
      user-select: text;
      -webkit-user-select: text;
      letter-spacing: 0.002em;
    }

    .spiral-path {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .headline-line {
      position: absolute;
      white-space: pre;
      font-weight: 700;
      z-index: 2;
      user-select: text;
      -webkit-user-select: text;
      letter-spacing: -0.5px;
    }

    .curvature-label {
      position: absolute;
      font: 400 10px/1 "Menlo", "Consolas", monospace;
      color: rgba(0, 212, 255, 0.3);
      pointer-events: none;
      z-index: 0;
    }

    .hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      font: 400 13px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: rgba(200, 230, 255, 0.22);
      z-index: 100;
      background: rgba(10, 22, 40, 0.7);
      padding: 8px 18px;
      border-radius: 999px;
      pointer-events: none;
      white-space: nowrap;
    }

    .mode-switcher {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
    }
    .mode-btn {
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.2);
      color: rgba(200, 230, 255, 0.6);
      padding: 6px 16px;
      border-radius: 16px;
      cursor: pointer;
      font: 400 11px/1 "Menlo", "Consolas", monospace;
      letter-spacing: 0.04em;
      transition: all 0.3s;
    }
    .mode-btn:hover { border-color: rgba(0, 212, 255, 0.5); color: #c8e6ff; }
    .mode-btn.active {
      background: rgba(0, 212, 255, 0.15);
      border-color: rgba(0, 212, 255, 0.5);
      color: #00d4ff;
    }

    .atmosphere {
      position: absolute;
      inset: -10%;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(50% 50% at 65% 35%, rgba(0, 100, 200, 0.08), transparent 60%),
        radial-gradient(40% 40% at 35% 65%, rgba(255, 107, 107, 0.05), transparent 55%);
    }

    @media (max-width: 760px) {
      .hint, .mode-switcher { display: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="atmosphere"></div>
  </div>
  <div class="hint">Resize to reflow · Toggle modes below · Text laid out entirely in JS via pretext</div>
  <div class="mode-switcher">
    <button class="mode-btn active" data-mode="flow">Flow Around</button>
    <button class="mode-btn" data-mode="curvature">Curvature Type</button>
    <button class="mode-btn" data-mode="dual">Dual Column</button>
  </div>

  <script type="module" src="./euler-spiral-text.ts"></script>
</body>
</html>
